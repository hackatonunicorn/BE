<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Startup VC Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .back-link {
            display: flex;
            align-items: center;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-link:hover {
            color: #334155;
        }

        .back-arrow {
            margin-right: 8px;
            font-size: 16px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #3b82f6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .logo-text {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 16px;
            color: #64748b;
            text-align: center;
            margin-bottom: 40px;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group.half {
            display: flex;
            gap: 16px;
        }

        .form-group.half .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 16px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
        }

        .password-toggle:hover {
            color: #6b7280;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: flex-start;
            margin-bottom: 32px;
        }

        .checkbox {
            margin-right: 12px;
            margin-top: 2px;
            width: 16px;
            height: 16px;
            accent-color: #3b82f6;
        }

        .checkbox-label {
            font-size: 14px;
            color: #374151;
            line-height: 1.5;
        }

        .checkbox-label a {
            color: #3b82f6;
            text-decoration: none;
        }

        .checkbox-label a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background: #2563eb;
        }

        .submit-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .submit-arrow {
            margin-left: 8px;
            font-size: 16px;
        }

        .login-link {
            text-align: center;
            margin-top: 32px;
            color: #64748b;
            font-size: 14px;
        }

        .login-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .loading {
            display: none;
        }

        .loading .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .password-requirements {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        .requirement {
            display: flex;
            align-items: center;
            margin-bottom: 2px;
        }

        .requirement.met {
            color: #059669;
        }

        .requirement-icon {
            margin-right: 4px;
            font-size: 10px;
        }

        @media (max-width: 640px) {
            .form-container {
                margin: 20px;
                padding: 24px;
            }

            .title {
                font-size: 28px;
            }

            .form-group.half {
                flex-direction: column;
                gap: 0;
            }

            .form-group.half .form-group {
                margin-bottom: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="back-link">
            <span class="back-arrow">←</span>
            Back to Home
        </a>
    </div>

    <div class="container">
        <div class="logo">
            <div class="logo-text">U</div>
        </div>
        
        <h1 class="title">Create your account</h1>
        <p class="subtitle">Start your fundraising journey today</p>

        <div class="form-container">
            <div id="error-message" class="error-message" style="display: none;"></div>
            
            <form id="register-form">
                <div class="form-group half">
                    <div class="form-group">
                        <label class="form-label" for="first_name">First name</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input 
                                type="text" 
                                id="first_name" 
                                name="first_name" 
                                class="form-input" 
                                placeholder="John"
                                required
                            >
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="last_name">Last name</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input 
                                type="text" 
                                id="last_name" 
                                name="last_name" 
                                class="form-input" 
                                placeholder="Doe"
                                required
                            >
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉</span>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="john@company.com"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="company_name">Company name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🏢</span>
                        <input 
                            type="text" 
                            id="company_name" 
                            name="company_name" 
                            class="form-input" 
                            placeholder="Acme Inc."
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Create a strong password"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            👁
                        </button>
                    </div>
                    <div class="password-requirements" id="password-requirements">
                        <div class="requirement" id="req-length">
                            <span class="requirement-icon">•</span>
                            At least 8 characters
                        </div>
                        <div class="requirement" id="req-uppercase">
                            <span class="requirement-icon">•</span>
                            One uppercase letter
                        </div>
                        <div class="requirement" id="req-lowercase">
                            <span class="requirement-icon">•</span>
                            One lowercase letter
                        </div>
                        <div class="requirement" id="req-number">
                            <span class="requirement-icon">•</span>
                            One number
                        </div>
                    </div>
                </div>

                <div class="checkbox-wrapper">
                    <input type="checkbox" id="terms" name="terms" class="checkbox" required>
                    <label for="terms" class="checkbox-label">
                        I agree to the <a href="/terms" target="_blank">Terms of Service</a> and <a href="/privacy" target="_blank">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <span class="loading" id="loading">
                        <span class="spinner"></span>
                        Creating account...
                    </span>
                    <span id="btn-text">
                        Create account
                        <span class="submit-arrow">→</span>
                    </span>
                </button>
            </form>

            <div class="login-link">
                Already have an account? <a href="/login">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁';
            }
        }

        function checkPasswordRequirements(password) {
            const requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /\d/.test(password)
            };

            // Update visual indicators
            document.getElementById('req-length').className = `requirement ${requirements.length ? 'met' : ''}`;
            document.getElementById('req-uppercase').className = `requirement ${requirements.uppercase ? 'met' : ''}`;
            document.getElementById('req-lowercase').className = `requirement ${requirements.lowercase ? 'met' : ''}`;
            document.getElementById('req-number').className = `requirement ${requirements.number ? 'met' : ''}`;

            return Object.values(requirements).every(req => req);
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'none';
        }

        function setLoading(loading) {
            const submitBtn = document.getElementById('submit-btn');
            const loadingSpan = document.getElementById('loading');
            const btnText = document.getElementById('btn-text');
            
            if (loading) {
                submitBtn.disabled = true;
                loadingSpan.style.display = 'inline';
                btnText.style.display = 'none';
            } else {
                submitBtn.disabled = false;
                loadingSpan.style.display = 'none';
                btnText.style.display = 'inline';
            }
        }

        // Password validation
        document.getElementById('password').addEventListener('input', (e) => {
            checkPasswordRequirements(e.target.value);
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            
            // Validate password
            const password = formData.get('password');
            if (!checkPasswordRequirements(password)) {
                showError('Please ensure your password meets all requirements.');
                return;
            }

            // Validate terms acceptance
            if (!formData.get('terms')) {
                showError('Please accept the Terms of Service and Privacy Policy.');
                return;
            }

            const registerData = {
                email: formData.get('email'),
                password: password,
                full_name: `${formData.get('first_name')} ${formData.get('last_name')}`,
                first_name: formData.get('first_name'),
                last_name: formData.get('last_name'),
                company_name: formData.get('company_name') || null,
                role: 'startup'
            };

            hideError();
            setLoading(true);

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(registerData)
                });

                const data = await response.json();

                if (response.ok) {
                    // Store tokens
                    localStorage.setItem('access_token', data.tokens.access_token);
                    localStorage.setItem('refresh_token', data.tokens.refresh_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirect to dashboard
                    window.location.href = '/dashboard';
                } else {
                    showError(data.detail || 'Registration failed. Please try again.');
                }
            } catch (error) {
                showError('Network error. Please try again.');
                console.error('Registration error:', error);
            } finally {
                setLoading(false);
            }
        });

        // Check if user is already logged in
        if (localStorage.getItem('access_token')) {
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
