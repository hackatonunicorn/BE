groups:
  - name: startup-vc-alerts
    rules:
      # Application Health Alerts
      - alert: ApplicationDown
        expr: up{job="startup-vc-app"} == 0
        for: 1m
        labels:
          severity: critical
          service: application
        annotations:
          summary: "Startup VC Application is down"
          description: "The FastAPI application has been down for more than 1 minute."

      - alert: ApplicationHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: application
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second for the last 5 minutes."

      - alert: ApplicationHighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: application
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }} seconds."

      # Database Alerts
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "PostgreSQL database is down"
          description: "The PostgreSQL database has been down for more than 1 minute."

      - alert: DatabaseHighConnections
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "High database connections"
          description: "Database connections are at {{ $value | humanizePercentage }} of maximum."

      - alert: DatabaseSlowQueries
        expr: rate(pg_stat_database_tup_returned[5m]) / rate(pg_stat_database_tup_fetched[5m]) < 0.1
        for: 10m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "Slow database queries detected"
          description: "Database query efficiency is below 10%."

      # Redis Alerts
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute."

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is at {{ $value | humanizePercentage }} of maximum."

      - alert: RedisHighConnectedClients
        expr: redis_connected_clients > 1000
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High number of Redis connections"
          description: "Redis has {{ $value }} connected clients."

      # Celery Worker Alerts
      - alert: CeleryWorkerDown
        expr: up{job="celery-worker"} == 0
        for: 2m
        labels:
          severity: critical
          service: celery
        annotations:
          summary: "Celery worker is down"
          description: "Celery worker has been down for more than 2 minutes."

      - alert: CeleryQueueBacklog
        expr: celery_queue_length > 100
        for: 5m
        labels:
          severity: warning
          service: celery
        annotations:
          summary: "High Celery queue backlog"
          description: "Celery queue has {{ $value }} pending tasks."

      - alert: CeleryTaskFailures
        expr: rate(celery_tasks_failed_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: celery
        annotations:
          summary: "High Celery task failure rate"
          description: "Celery task failure rate is {{ $value }} failures per second."

      # Business Metrics Alerts
      - alert: HighEmailFailureRate
        expr: rate(emails_failed_total[1h]) / rate(emails_sent_total[1h]) > 0.05
        for: 10m
        labels:
          severity: warning
          service: email
        annotations:
          summary: "High email failure rate"
          description: "Email failure rate is {{ $value | humanizePercentage }} over the last hour."

      - alert: NoNewCommunications
        expr: increase(communications_created_total[1h]) == 0
        for: 1h
        labels:
          severity: warning
          service: business
        annotations:
          summary: "No new communications in the last hour"
          description: "No new communications have been created in the last hour."

      - alert: LowMeetingConversionRate
        expr: rate(meetings_scheduled_total[24h]) / rate(communications_created_total[24h]) < 0.05
        for: 1h
        labels:
          severity: warning
          service: business
        annotations:
          summary: "Low meeting conversion rate"
          description: "Meeting conversion rate is {{ $value | humanizePercentage }} over the last 24 hours."

      # Infrastructure Alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: LowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
          service: infrastructure
        annotations:
          summary: "Low disk space"
          description: "Disk space usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: ContainerRestart
        expr: rate(container_start_time_seconds[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Container restart detected"
          description: "Container {{ $labels.name }} has restarted."

      # Security Alerts
      - alert: HighRateLimitHits
        expr: rate(nginx_http_requests_total{status="429"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "High rate limit hits"
          description: "Rate limiting is blocking {{ $value }} requests per second."

      - alert: SuspiciousActivity
        expr: rate(nginx_http_requests_total{status=~"4.."}[5m]) > 50
        for: 5m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Suspicious activity detected"
          description: "High number of 4xx errors: {{ $value }} per second."

  - name: startup-vc-business-rules
    rules:
      # Business KPIs
      - record: business:communication_success_rate
        expr: rate(communications_successful_total[24h]) / rate(communications_created_total[24h])

      - record: business:average_response_time_hours
        expr: avg_over_time(communication_response_time_hours[24h])

      - record: business:email_delivery_rate
        expr: rate(emails_delivered_total[1h]) / rate(emails_sent_total[1h])

      - record: business:meeting_conversion_rate
        expr: rate(meetings_scheduled_total[24h]) / rate(communications_created_total[24h])

      - record: business:escalation_rate
        expr: rate(communications_escalated_total[24h]) / rate(communications_created_total[24h])
